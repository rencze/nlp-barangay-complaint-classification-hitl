#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="bold" text-anchor="middle" x="969" y="1609">Yes</text><path d="M940,1706 L940,1724" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><polygon fill="white" points="940,1713 1127,1782 940,1851 753,1782" stroke="#111" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle" x="940" y="1775">Passes release</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle" x="940" y="1804">criteria?</text><rect fill="white" height="96" stroke="#111" stroke-width="2" width="483" x="75" y="1880" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="23" font-weight="bold" text-anchor="middle" x="316.5" y="1920.5">Retain Deployed Model</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="316.5" y="1949.5">Archive failed candidate; current version remains</text><rect fill="white" height="96" stroke="#111" stroke-width="2" width="520" x="680" y="1880" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="21" font-weight="bold" text-anchor="middle" x="940.0" y="1920.5">Approve and Release Versioned Pipeline</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="940.0" y="1949.5">NLP + TF-IDF + SVM + calibrated model</text><path d="M753,1782 L318,1782 L318,1880" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" x="573" y="1765">No</text><path d="M940,1851 L940,1880" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" x="969" y="1869">Yes</text><path d="M680,2018 L24,2018 L24,534 L363,534" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-dasharray="8,7" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="start" x="78" y="1744">Approved model for</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="start" x="78" y="1767">future predictions only</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="17" font-weight="normal" text-anchor="middle" x="640.0" y="2096">Solid arrows: case flow     Dashed arrows: verified training feedback and approved model release</text></svg>