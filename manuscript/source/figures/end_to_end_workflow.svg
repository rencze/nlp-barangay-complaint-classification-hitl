<svg baseProfile="full" height="2120px" version="1.1" viewBox="0 0 1280 2120" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path d="M0 0 L9 4 L0 8 Z" fill="black" /></marker></defs><rect fill="white" height="2120" width="1280" x="0" y="0" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="29" font-weight="bold" text-anchor="middle" x="640.0" y="52">Integrated Barangay Complaint Classification and Management Workflow</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="21" font-weight="normal" text-anchor="middle" x="640.0" y="85">Live complaint processing and controlled offline model maintenance</text><rect fill="none" height="930" stroke="#666" stroke-dasharray="10,7" stroke-width="1.5" width="1170" x="55" y="133" /><rect fill="white" height="29" width="310" x="73" y="119" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="bold" text-anchor="start" x="81" y="141">A. Live Complaint Processing</text><rect fill="white" height="80" stroke="#111" stroke-width="2" width="554" x="363" y="158" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="640.0" y="190.5">Resident Submits Complaint</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle" x="640.0" y="219.5">Subject and narrative; supporting context if available</text><rect fill="white" height="76" stroke="#111" stroke-width="2" width="554" x="363" y="277" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="640.0" y="307.5">Meaning-Preserving NLP</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="640.0" y="336.5">Prepare privacy-conscious narrative for text features</text><rect fill="white" height="75" stroke="#111" stroke-width="2" width="554" x="363" y="389" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="640.0" y="419.0">Fitted Word + Character TF-IDF</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle" x="640.0" y="448.0">Transform text using saved vectorizers</text><rect fill="white" height="75" stroke="#111" stroke-width="2" width="554" x="363" y="497" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="640.0" y="527.0">Saved, Calibrated Linear SVM</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle" x="640.0" y="556.0">Predict Valid / Suspicious / Spam</text><path d="M640,238 L640,277" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><path d="M640,353 L640,389" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><path d="M640,464 L640,497" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><path d="M640,572 L640,610" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><polygon fill="white" points="640,611 840,693 640,775 440,693" stroke="#111" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle" x="640" y="686">Predicted Suspicious</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle" x="640" y="715">or Spam?</text><rect fill="white" height="82" stroke="#111" stroke-width="2" width="440" x="84" y="849" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="304.0" y="882.5">Accepted Case Management</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle" x="304.0" y="911.5">Unresolved / Ongoing / Resolved</text><rect fill="white" height="106" stroke="#111" stroke-width="2" width="440" x="761" y="810" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="981.0" y="841.0">Human-in-the-Loop Review</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle" x="981.0" y="870.0">Verify or correct TEXT label</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="981.0" y="899.0">Accept / Clarify / Reject independently</text><path d="M440,693 L304,693 L304,849" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" x="336" y="746">No: Valid</text><path d="M840,693 L981,693 L981,810" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" x="920" y="744">Yes</text><rect fill="white" height="70" stroke="#111" stroke-width="2" width="440" x="761" y="969" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="21" font-weight="bold" text-anchor="middle" x="981.0" y="996.5">Non-Accepted Outcome Record</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="middle" x="981.0" y="1025.5">Pending clarification or documented rejection</text><path d="M761,869 L524,869" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="middle" x="647" y="852">Accepted after review</text><path d="M1102,916 L1102,969" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="middle" x="995" y="949">Clarify / reject</text><rect fill="none" height="175" stroke="#666" stroke-dasharray="10,7" stroke-width="1.5" width="1170" x="55" y="1104" /><rect fill="white" height="29" width="470" x="73" y="1090" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="bold" text-anchor="start" x="81" y="1112">B. Separate Operational and Training Records</text><rect fill="white" height="115" stroke="#111" stroke-width="2" width="535" x="81" y="1132" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="348.5" y="1167.5">Case and Action Records</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="348.5" y="1196.5">Disposition; assignments; deadlines;</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="348.5" y="1225.5">actions; referrals; verified resolution</text><rect fill="white" height="115" stroke="#111" stroke-width="2" width="535" x="666" y="1132" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle" x="933.5" y="1167.5">Versioned Human-Verified Labels</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="933.5" y="1196.5">Narrative version; verified class;</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="normal" text-anchor="middle" x="933.5" y="1225.5">correction reason; audit/provenance</text><path d="M304,931 L304,1132" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><path d="M1102,1039 L1102,1080 L585,1080 L585,1132" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-linejoin="round" stroke-width="2" /><path d="M1201,860 L1232,860 L1232,1100 L982,1100 L982,1132" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-dasharray="8,7" stroke-linejoin="round" stroke-width="2" /><rect fill="none" height="750" stroke="#666" stroke-dasharray="10,7" stroke-width="1.5" width="1170" x="55" y="1313" /><rect fill="white" height="29" width="420" x="73" y="1299" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="19" font-weight="bold" text-anchor="start" x="81" y="1321">C. Controlled Offline Model Maintenance</text><rect fill="white" height="79" stroke="#111" stroke-width="2" width="520" x="680" y="1341" /><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle" x="940.0" y="1373.0">Quality Check and Consolidate Feedback</text><text fill="#111" font-family="Liberation Serif, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle" x="940.0" y="1402.0">Only eligible verified narrative labels</text><path d="M933,1247 L933,1341" fill="none" marker-end="url(#arrow)" stroke="#111" stroke-dasharray="8,7" stroke-linejoin="round" stroke-width="2" /><path d="M940,1420 L940,1445" fill="none" marker-end="url(#arro